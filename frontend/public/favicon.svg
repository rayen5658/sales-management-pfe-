<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6dd832"/>
      <stop offset="100%" stop-color="#3aa810"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4eb8e8"/>
      <stop offset="100%" stop-color="#1a7ec8"/>
    </linearGradient>
    <linearGradient id="g-red" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8403a"/>
      <stop offset="100%" stop-color="#b01c18"/>
    </linearGradient>
    <linearGradient id="g-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4750a"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c6de0"/>
      <stop offset="100%" stop-color="#4a3ab0"/>
    </linearGradient>
  </defs>

  <!-- Left cube -->
  <polygon points="12,42 42,24 42,62 12,80" fill="url(#g-green)" filter="url(#s)"/>
  <polygon points="12,42 42,24 64,34 34,52" fill="url(#g-blue)"/>
  <polygon points="42,62 42,24 64,34 64,72" fill="url(#g-orange)"/>

  <!-- Right cube -->
  <polygon points="34,22 62,6  62,44 34,60" fill="url(#g-purple)"/>
  <polygon points="34,22 62,6  84,16 56,32" fill="url(#g-blue)"/>
  <polygon points="62,6  84,16 84,54 62,44" fill="url(#g-red)"/>

  <!-- Base shadow -->
  <ellipse cx="48" cy="88" rx="28" ry="5" fill="rgba(0,0,0,0.12)"/>
</svg>
